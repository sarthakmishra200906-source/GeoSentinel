<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windy Forecast</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
    <style>
      html, body, #windy {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0f172a;
      }

      /* ── Pure Rain Mode: completely hide wind particle canvas ── */
      #windy.pure-rain-mode canvas {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .cyclone-marker-icon {
        background: transparent !important;
        border: none !important;
      }
      .cyclone-pin {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
      }
      .cyclone-spin {
        display: inline-block;
        font-size: 28px;
        line-height: 1;
        animation: spin-cyclone 2.5s linear infinite;
      }
      @keyframes spin-cyclone {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      .cyclone-label {
        margin-top: 3px;
        padding: 2px 7px;
        background: rgba(220, 38, 38, 0.95);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        border-radius: 4px;
        white-space: nowrap;
        box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        pointer-events: none;
      }
      .cyclone-label.forming { background: rgba(234, 88, 12, 0.95); }
      .cyclone-label.upcoming { background: rgba(202, 138, 4, 0.95); }
      .cyclone-label.recent { background: rgba(100, 116, 139, 0.95); }
      .cyclone-popup-content {
        min-width: 210px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
      }
      .cyclone-popup-header {
        font-size: 15px;
        font-weight: 700;
        color: #dc2626;
        border-bottom: 1px solid #fee2e2;
        padding-bottom: 4px;
        margin-bottom: 6px;
      }
      .cyclone-popup-row {
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 3px;
      }
      .cyclone-popup-threat {
        margin-top: 6px;
        padding: 4px 6px;
        background: #fff7ed;
        border-left: 3px solid #ea580c;
        color: #9a3412;
        font-size: 11px;
        line-height: 1.4;
      }
      #layer-indicator {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        padding: 8px 16px;
        border-radius: 999px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        pointer-events: none;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rain-legend-bar {
        display: inline-block;
        width: 96px;
        height: 8px;
        border-radius: 3px;
        background: linear-gradient(to right, #1f2937, #7dd3fc, #38bdf8, #0284c7, #1e3a8a);
      }
    </style>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  </head>
  <body>
    <div id="windy"></div>
    <div id="layer-indicator">
      <span>💨 Wind Streamlines Active</span>
    </div>

    <script>
      const key = new URLSearchParams(window.location.search).get('key')
      if (!key) {
        document.body.textContent = 'Windy Map Forecast key is not configured.'
      } else {
        const pendingMessages = []
        let windyInstance = null
        let rainHeatOverlay = null
        let rainHeatActive = false
        let rainHeatToken = 0
        let rainHeatTimer = null
        let rainHeatBoundsKey = ''
        let cycloneLayerGroup = null
        let cycloneMarkersMap = new Map()

        function updateIndicator(html, borderColor) {
          const el = document.getElementById('layer-indicator')
          if (el) {
            el.innerHTML = html
            el.style.borderColor = borderColor || 'rgba(255, 255, 255, 0.2)'
          }
        }

        function escapeHtml(value) {
          return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
          })[char])
        }

        function stormBadge(status) {
          const badges = {
            ACTIVE_LIVE_GDACS: { className: 'active', label: 'ACTIVE · GDACS' },
            ACTIVE_ATCF: { className: 'active', label: 'ACTIVE · ATCF' },
            FORMING_DEPRESSION: { className: 'forming', label: 'FORMING DEPRESSION' },
            FORMING_INVEST: { className: 'forming', label: 'FORMING · INVEST' },
            UPCOMING_GDACS: { className: 'upcoming', label: 'UPCOMING' },
            RECENT_GDACS: { className: 'recent', label: 'RECENT · ENDED' },
          }
          return badges[status] || { className: 'unconfirmed', label: 'STATUS UNCONFIRMED' }
        }

        function coneRadiusForLeadHours(hour) {
          const anchors = [[6, 25], [12, 45], [24, 75], [48, 120]]
          if (hour <= anchors[0][0]) return anchors[0][1]
          for (let index = 1; index < anchors.length; index += 1) {
            const [endHour, endRadius] = anchors[index]
            if (hour <= endHour) {
              const [startHour, startRadius] = anchors[index - 1]
              return Math.round(startRadius + (endRadius - startRadius) * (hour - startHour) / (endHour - startHour))
            }
          }
          return anchors[anchors.length - 1][1]
        }

        function setupLayers(map) {
          if (!cycloneLayerGroup) {
            cycloneLayerGroup = L.layerGroup().addTo(map)
          }
          const rainPane = map.getPane('rainFieldPane') || map.createPane('rainFieldPane')
          rainPane.style.zIndex = '240'
          rainPane.style.pointerEvents = 'none'
          // Rebuild the rainfall heat field for the newly visible area.
          map.on('moveend zoomend', () => scheduleRainField())
        }

        // Rain = grey base map with blue shading ONLY where there is a real
        // chance of rain. Probability comes from Open-Meteo (next 24 hours).
        // No probability -> fully transparent, so the map stays grey.
        const BLUE_STOPS = [
          [0, [125, 211, 252]],
          [0.4, [56, 189, 248]],
          [0.75, [2, 132, 199]],
          [1, [30, 58, 138]],
        ]

        function rainBlue(probability) {
          if (!Number.isFinite(probability) || probability <= 8) return [0, 0, 0, 0]
          const t = Math.min(1, Math.max(0, (probability - 8) / 92))
          let lo = BLUE_STOPS[0]
          let hi = BLUE_STOPS[BLUE_STOPS.length - 1]
          for (let i = 1; i < BLUE_STOPS.length; i += 1) {
            if (t <= BLUE_STOPS[i][0]) {
              lo = BLUE_STOPS[i - 1]
              hi = BLUE_STOPS[i]
              break
            }
          }
          const localT = hi[0] === lo[0] ? 0 : (t - lo[0]) / (hi[0] - lo[0])
          const r = Math.round(lo[1][0] + (hi[1][0] - lo[1][0]) * localT)
          const g = Math.round(lo[1][1] + (hi[1][1] - lo[1][1]) * localT)
          const b = Math.round(lo[1][2] + (hi[1][2] - lo[1][2]) * localT)
          const alpha = Math.round(255 * Math.min(0.92, 0.16 + (probability - 8) / 55))
          return [r, g, b, Math.max(0, alpha)]
        }

        function mercY(latDeg) {
          const lat = Math.max(-85, Math.min(85, latDeg)) * Math.PI / 180
          return Math.log(Math.tan(Math.PI / 4 + lat / 2))
        }

        function scheduleRainField() {
          if (!rainHeatActive || !windyInstance || !windyInstance.map) return
          clearTimeout(rainHeatTimer)
          rainHeatTimer = setTimeout(() => buildRainField(), 350)
        }

        function renderRainField(samples, south, north, west, east) {
          const fw = 160
          const fh = 120
          const canvas = document.createElement('canvas')
          canvas.width = fw
          canvas.height = fh
          const ctx = canvas.getContext('2d')
          const img = ctx.createImageData(fw, fh)
          const spanLon = Math.max(1e-6, east - west)
          const northY = mercY(north)
          const spanY = Math.max(1e-6, northY - mercY(south))
          const points = samples.map((s) => ({
            x: (s.lon - west) / spanLon,
            y: (northY - mercY(s.lat)) / spanY,
            probability: s.probability,
          }))

          for (let y = 0; y < fh; y += 1) {
            const py = (y + 0.5) / fh
            for (let x = 0; x < fw; x += 1) {
              const px = (x + 0.5) / fw
              let weightSum = 0
              let valueSum = 0
              for (let i = 0; i < points.length; i += 1) {
                const p = points[i]
                const dx = p.x - px
                const dy = p.y - py
                const weight = 1 / (dx * dx + dy * dy + 0.0006)
                weightSum += weight
                valueSum += weight * p.probability
              }
              const probability = weightSum > 0 ? valueSum / weightSum : 0
              const [r, g, b, a] = rainBlue(probability)
              const idx = (y * fw + x) * 4
              img.data[idx] = r
              img.data[idx + 1] = g
              img.data[idx + 2] = b
              img.data[idx + 3] = a
            }
          }
          ctx.putImageData(img, 0, 0)

          // Upscale with smoothing so low-probability areas stay transparent
          // and the blue patches have soft, natural edges over the grey map.
          const out = document.createElement('canvas')
          out.width = 640
          out.height = 480
          const octx = out.getContext('2d')
          octx.imageSmoothingEnabled = true
          octx.imageSmoothingQuality = 'high'
          octx.drawImage(canvas, 0, 0, out.width, out.height)
          return out.toDataURL('image/png')
        }

        async function buildRainField() {
          const map = windyInstance?.map
          if (!map || !rainHeatActive) return

          const raw = map.getBounds()
          const padLat = (raw.getNorth() - raw.getSouth()) * 0.18
          const padLon = (raw.getEast() - raw.getWest()) * 0.18
          const south = Math.max(-85, raw.getSouth() - padLat)
          const north = Math.min(85, raw.getNorth() + padLat)
          const west = raw.getWest() - padLon
          const east = raw.getEast() + padLon
          const bounds = L.latLngBounds([south, west], [north, east])

          const key = [south, north, west, east].map((v) => v.toFixed(2)).join(':')
          if (key === rainHeatBoundsKey && rainHeatOverlay) return

          const token = ++rainHeatToken
          const cols = 16
          const rows = 12
          const lats = []
          const lons = []
          for (let r = 0; r < rows; r += 1) {
            const lat = south + (north - south) * (r + 0.5) / rows
            for (let c = 0; c < cols; c += 1) {
              lats.push(+lat.toFixed(3))
              lons.push(+(west + (east - west) * (c + 0.5) / cols).toFixed(3))
            }
          }

          updateIndicator('<span>🌧️ Rain field: loading chance-of-rain data…</span>', '#0284c7')

          try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lons.join(',')}&hourly=precipitation_probability&forecast_hours=24&timezone=UTC`
            const response = await fetch(url)
            if (!response.ok) throw new Error(`Rain probability data HTTP ${response.status}`)
            const payload = await response.json()
            if (token !== rainHeatToken || !rainHeatActive) return

            const list = Array.isArray(payload) ? payload : [payload]
            const samples = list.map((item, index) => {
              const values = item?.hourly?.precipitation_probability || []
              const probability = values.reduce((max, v) => Math.max(max, Number(v) || 0), 0)
              return {
                lat: Number(item?.latitude ?? lats[index]),
                lon: Number(item?.longitude ?? lons[index]),
                probability,
              }
            }).filter((s) => Number.isFinite(s.lat) && Number.isFinite(s.lon))
            if (!samples.length) throw new Error('No rain-probability samples returned')

            // Only shade blue when the API actually reports a chance of rain.
            // With no meaningful data the map simply stays grey.
            const peak = Math.max(...samples.map((s) => s.probability))
            if (peak < 10) {
              if (rainHeatOverlay) {
                map.removeLayer(rainHeatOverlay)
                rainHeatOverlay = null
              }
              rainHeatBoundsKey = ''
              updateIndicator('<span>🌧️ Rain map — no rain expected</span>', '#0284c7')
              return
            }

            const dataUrl = renderRainField(samples, south, north, west, east)
            if (token !== rainHeatToken || !rainHeatActive) return

            if (rainHeatOverlay) map.removeLayer(rainHeatOverlay)
            rainHeatOverlay = L.imageOverlay(dataUrl, bounds, {
              pane: 'rainFieldPane',
              opacity: 1,
              interactive: false,
            }).addTo(map)
            rainHeatBoundsKey = key

            updateIndicator(
              `<span>🌧️ Chance of rain (24h):</span> <span class="rain-legend-bar"></span> <span>None → Likely · peak ${peak.toFixed(0)}%</span>`,
              '#0284c7',
            )
          } catch (err) {
            if (token !== rainHeatToken) return
            console.warn('[Rain] Rain data unavailable, keeping grey map:', err)
            if (rainHeatOverlay) {
              map.removeLayer(rainHeatOverlay)
              rainHeatOverlay = null
            }
            rainHeatBoundsKey = ''
            updateIndicator('<span>🌧️ Rain map — data unavailable</span>', '#0284c7')
          }
        }

        function setRainField(enabled) {
          rainHeatActive = enabled
          rainHeatToken += 1
          clearTimeout(rainHeatTimer)
          const map = windyInstance?.map
          if (!map) return
          if (!enabled) {
            if (rainHeatOverlay) {
              map.removeLayer(rainHeatOverlay)
              rainHeatOverlay = null
            }
            rainHeatBoundsKey = ''
            return
          }
          buildRainField()
        }

        function renderCyclones(storms, enabled) {
          if (!windyInstance || !windyInstance.map || !cycloneLayerGroup) return
          cycloneLayerGroup.clearLayers()
          cycloneMarkersMap.clear()

          if (!enabled || !Array.isArray(storms) || storms.length === 0) return

          storms.forEach((storm) => {
            if (!storm.coordinates || !storm.coordinates.length) return
            const eye = storm.coordinates[storm.coordinates.length - 1]
            if (!eye || !Array.isArray(eye) || eye.length < 2) return

            // 1. Forecast / past track polyline
            if (storm.coordinates.length > 1) {
              const poly = L.polyline(storm.coordinates, {
                color: '#ef4444',
                weight: 4,
                dashArray: '8, 6',
                opacity: 0.88,
              })
              poly.addTo(cycloneLayerGroup)
            }

            // JTWC/NHC forecast points are drawn as an IMD-style cone of uncertainty.
            if (Array.isArray(storm.forecastTrack) && storm.forecastTrack.length > 0) {
              const forecastPoints = storm.forecastTrack
                .filter((point) => Array.isArray(point) && point.length >= 2 && Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1])))
                .map((point) => [Number(point[0]), Number(point[1])])
              if (forecastPoints.length > 1) {
                L.polyline([eye, ...forecastPoints], {
                  color: '#fbbf24',
                  weight: 3,
                  dashArray: '5, 6',
                  opacity: 0.95,
                }).addTo(cycloneLayerGroup)
              }
              storm.forecastTrack.forEach((point) => {
                const leadHours = Number(point[2])
                if (!Array.isArray(point) || !Number.isFinite(Number(point[0])) || !Number.isFinite(Number(point[1]))) return
                if (Number.isFinite(leadHours) && leadHours > 0) {
                  L.circle([Number(point[0]), Number(point[1])], {
                    radius: coneRadiusForLeadHours(leadHours) * 1000,
                    color: '#f59e0b',
                    fillColor: '#fbbf24',
                    fillOpacity: 0.08,
                    weight: 1,
                    dashArray: '6, 6',
                  }).addTo(cycloneLayerGroup)
                }
                L.circleMarker([Number(point[0]), Number(point[1])], {
                  radius: 4,
                  color: '#b45309',
                  fillColor: '#fbbf24',
                  fillOpacity: 0.95,
                  weight: 1,
                }).bindPopup(`+${Number.isFinite(leadHours) ? leadHours : '?'}h forecast point`).addTo(cycloneLayerGroup)
              })
            }

            // Providers do not always publish wind radii; never invent warning zones.
            if (storm.radiiKm?.warning) {
              L.circle(eye, {
                radius: storm.radiiKm.warning * 1000,
                color: '#f97316',
                fillColor: '#ea580c',
                fillOpacity: 0.16,
                weight: 2,
                dashArray: '5, 5',
              }).addTo(cycloneLayerGroup)
            }
            if (storm.radiiKm?.danger) {
              L.circle(eye, {
                radius: storm.radiiKm.danger * 1000,
                color: '#dc2626',
                fillColor: '#b91c1c',
                fillOpacity: 0.28,
                weight: 2,
              }).addTo(cycloneLayerGroup)
            }

            // Animated spinning cyclone eye icon with a status-coloured badge.
            const badge = stormBadge(storm.status)
            const cleanName = escapeHtml((storm.name || 'Cyclone').replace(/^🌀\s*/, ''))
            const icon = L.divIcon({
              className: 'cyclone-marker-icon',
              html: `<div class="cyclone-pin" title="${cleanName}"><span class="cyclone-spin">🌀</span><span class="cyclone-label ${escapeHtml(badge.className)}">${cleanName}</span></div>`,
              iconSize: [40, 40],
              iconAnchor: [20, 20],
            })

            const marker = L.marker(eye, { icon }).addTo(cycloneLayerGroup)
            const sourceLabel = escapeHtml(storm.source || (Array.isArray(storm.sources) ? storm.sources.join(' + ') : 'unknown'))
            const forecastCount = Array.isArray(storm.forecastTrack) ? storm.forecastTrack.length : 0
            const popupContent = `
              <div class="cyclone-popup-content">
                <div class="cyclone-popup-header">🌀 ${cleanName}</div>
                <div class="cyclone-popup-row"><b>Status:</b> ${escapeHtml(badge.label)}</div>
                <div class="cyclone-popup-row"><b>Category:</b> ${escapeHtml(storm.category || 'Tropical Storm')}</div>
                <div class="cyclone-popup-row"><b>Max Wind:</b> ${storm.maxWindKmh || '—'} km/h</div>
                ${storm.centralPressureHpa ? `<div class="cyclone-popup-row"><b>Central Pressure:</b> ${storm.centralPressureHpa} hPa</div>` : ''}
                ${storm.basin ? `<div class="cyclone-popup-row"><b>Basin:</b> ${escapeHtml(storm.basin)}</div>` : ''}
                <div class="cyclone-popup-row"><b>Source:</b> ${sourceLabel}</div>
                <div class="cyclone-popup-row"><b>Forecast points:</b> ${forecastCount}</div>
                <div class="cyclone-popup-row"><b>Eye:</b> ${eye[0].toFixed(2)}°, ${eye[1].toFixed(2)}°</div>
              </div>
            `
            marker.bindPopup(popupContent)
            cycloneMarkersMap.set(storm.id, marker)
          })
        }

        function processCommand(data) {
          if (!windyInstance) {
            pendingMessages.push(data)
            return
          }

          const windyEl = document.getElementById('windy')

          if (data.type === 'change-windy-overlay' && data.overlay) {
            try {
              const target = data.overlay
              console.log('[Windy] Changing overlay to:', target)

              if (target === 'wind') {
                if (windyEl) windyEl.classList.remove('pure-rain-mode')
                setRainField(false)
                windyInstance.store.set('overlay', 'wind')
                windyInstance.store.set('particlesAnim', 'on')
                updateIndicator('<span>💨 Wind Particles Active (Velocity Streamlines)</span>', '#38bdf8')
              } else if (target === 'temp') {
                // Temperature heat map
                if (windyEl) windyEl.classList.remove('pure-rain-mode')
                setRainField(false)
                windyInstance.store.set('overlay', 'temp')
                windyInstance.store.set('particlesAnim', 'off')
                updateIndicator('<span>🌡️ Heat Map Active (Cool → Warm → Hot)</span>', '#f97316')
              } else if (target === 'rain') {
                // Real 7-day rainfall heat field covering the whole map. Hide
                // Windy's own canvas so its wind/heat ramp cannot bleed through.
                if (windyEl) windyEl.classList.add('pure-rain-mode')
                setRainField(true)
                windyInstance.store.set('particlesAnim', 'off')
              } else {
                if (windyEl) windyEl.classList.remove('pure-rain-mode')
                setRainField(false)
                const allowed = typeof windyInstance.store.getAllowed === 'function'
                  ? windyInstance.store.getAllowed('overlay')
                  : ['wind', 'temp', 'pressure']
                if (Array.isArray(allowed) && allowed.includes(target)) {
                  windyInstance.store.set('overlay', target)
                }
                updateIndicator(`<span>🌐 ${target.toUpperCase()} Layer</span>`, '#38bdf8')
              }

              // store.set('overlay', ...) updates Windy's active overlay automatically without firing paramsChanged with undefined.
            } catch (err) {
              console.error('Windy overlay change error:', err)
            }
          } else if (data.type === 'update-cyclones') {
            renderCyclones(data.storms || [], data.enabled !== false)
          } else if (data.type === 'focus-cyclone') {
            try {
              if (data.coordinates && Array.isArray(data.coordinates)) {
                windyInstance.map.flyTo(data.coordinates, Math.max(windyInstance.map.getZoom(), 7), {
                  duration: 1.2,
                })
                if (data.id && cycloneMarkersMap.has(data.id)) {
                  setTimeout(() => {
                    const m = cycloneMarkersMap.get(data.id)
                    if (m) m.openPopup()
                  }, 800)
                }
              }
            } catch (err) {
              console.error('Focus cyclone error:', err)
            }
          } else if (data.type === 'open-windy-picker') {
            try {
              windyInstance.picker.open({ lat: data.lat, lon: data.lon })
              windyInstance.map.setView([data.lat, data.lon], Math.max(windyInstance.map.getZoom(), 8))
            } catch (err) {
              console.error('Windy picker open error:', err)
            }
          }
        }

        window.addEventListener('message', (event) => {
          if (!event.data || typeof event.data !== 'object') return
          processCommand(event.data)
        })

        windyInit({
          key,
          lat: 20.5937,
          lon: 78.9629,
          zoom: 5,
          overlay: 'wind',
          level: 'surface',
          product: 'gfs',
        }, function(windyAPI) {
          windyInstance = windyAPI
          setupLayers(windyAPI.map)

          const emitPicker = (params) => {
            const currentOverlay = windyAPI.store.get('overlay')
            window.parent.postMessage({
              type: 'windy-picker',
              lat: params.lat,
              lon: params.lon,
              values: Array.isArray(params.values) ? params.values : [],
              overlay: currentOverlay || params.overlay || null,
            }, '*')
          }

          windyAPI.picker.on('pickerOpened', emitPicker)
          windyAPI.picker.on('pickerMoved', emitPicker)

          windyAPI.map.on('click', (event) => {
            const point = { lat: event.latlng.lat, lon: event.latlng.lng }
            windyAPI.picker.open(point)
            window.parent.postMessage({
              type: 'windy-picker',
              ...point,
              values: [],
              overlay: windyAPI.store.get('overlay') || null,
            }, '*')
          })

          if (windyAPI.store && typeof windyAPI.store.on === 'function') {
            windyAPI.store.on('overlay', (overlay) => {
              window.parent.postMessage({
                type: 'windy-overlay-changed',
                overlay,
              }, '*')
            })
          }

          window.parent.postMessage({
            type: 'windy-ready',
            overlay: windyAPI.store.get('overlay') || 'wind',
          }, '*')

          while (pendingMessages.length > 0) {
            processCommand(pendingMessages.shift())
          }
        })
      }
    </script>
  </body>
</html>
